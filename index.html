<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ronde</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0e0d0d;
      --accent: rgba(255, 255, 255, 0.85);
      --muted: rgba(255, 255, 255, 0.65);
      --dur: 700ms;
      --ease: cubic-bezier(0.76, 0, 0.18, 1);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Helvetica Neue', sans-serif;
    }

    /* ─── Viewer : donne la perspective pour l'effet 3D de roue ─── */
    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1300px;
      perspective-origin: 50% 50%;
    }

    /* ─── Pages : toutes positionnées en absolu, centrées ────────── */
    .page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 90px;
      will-change: transform, opacity;
      /* La transition est appliquée dynamiquement via JS pour éviter
         un flash au chargement, puis réactivée */
    }

    .page img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 2px;
      /* L'ombre varie aussi selon la distance — appliquée via JS */
    }

    /* ─── Nav buttons ─────────────────────────────────────────────── */
    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      padding: 28px 18px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    body:hover .nav-btn { opacity: 1; }
    .nav-btn:hover { opacity: 1 !important; }
    .nav-btn.prev { left: 14px; }
    .nav-btn.next { right: 14px; }

    .nav-btn svg {
      width: 30px; height: 30px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }
    .nav-btn.prev:hover svg { transform: translateX(-3px); }
    .nav-btn.next:hover svg { transform: translateX(3px); }

    /* ─── Header ──────────────────────────────────────────────────── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 26px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 150;
      pointer-events: none;
    }

    #title {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
    }

    #counter {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 400;
    }

    /* ─── Indicateur circulaire ───────────────────────────────────── */
    #ronde {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      width: 88px; height: 88px;
    }

    #ronde svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .dot-ring {
      fill: none;
      stroke: rgba(255,255,255,0.07);
      stroke-width: 1;
    }

    .ronde-dot {
      fill: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: fill 0.4s ease;
    }
    .ronde-dot.active { fill: rgba(255,255,255,0.85); }

    #dots-group {
      transform-origin: 44px 44px;
      transition: transform var(--dur) var(--ease);
    }

    /* ─── Page 4 drawing animation ───────────────────────────────── */
    #page4-draw-overlay {
      position: fixed;
      z-index: 120;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    #page4-draw-overlay.active { opacity: 1; }
    .draw-anim-frame {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .draw-anim-frame.show { opacity: 1; }

    /* ─── Page 7 yellow rise ─────────────────────────────────────── */
    #page7-yellow-overlay {
      position: fixed;
      z-index: 110;
      pointer-events: none;
      transform: scaleY(0);
      transform-origin: bottom center;
      mix-blend-mode: multiply;
      background: linear-gradient(to top, rgb(255, 210, 0), transparent);
    }
    @keyframes page7-yellow-rise {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    #page7-yellow-overlay.active {
      animation: page7-yellow-rise 12s ease-out forwards;
    }

    /* ─── Hint ────────────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 128px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 1;
      transition: opacity 1.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <header id="header">
    <span id="title">Ronde</span>
    <span id="counter">1 / 20</span>
  </header>

  <div id="viewer"></div>

  <button class="nav-btn prev" id="btn-prev" aria-label="Page précédente">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="nav-btn next" id="btn-next" aria-label="Page suivante">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </button>

  <div id="ronde">
    <svg viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
      <circle class="dot-ring" cx="44" cy="44" r="34"/>
      <g id="dots-group"></g>
    </svg>
  </div>

  <p id="hint">← tourner la ronde →</p>

  <script>
    const TOTAL = 20;

    // ─── Paramètres de la roue ──────────────────────────────────────
    const STEP   = 230;  // px entre deux positions adjacentes
    const MAX_D  = 6;    // distance max visible (demi-roue)

    // Opacité selon la distance circulaire
    function opacityAt(d) {
      const t = [1, 0.14, 0.08, 0.055, 0.035, 0.022, 0.013];
      return t[Math.min(Math.abs(d), t.length - 1)];
    }

    // Ombre portée selon la distance
    function shadowAt(d) {
      if (d === 0) return '0 30px 90px rgba(0,0,0,0.65)';
      return '0 10px 30px rgba(0,0,0,0.3)';
    }

    // Scale selon la distance
    function scaleAt(d) {
      return Math.max(0.62, 1 - Math.abs(d) * 0.065);
    }

    // RotateY selon la distance — renforce la sensation de cylindre
    function rotYAt(d) {
      return d * 5.5; // degrés
    }

    // Distance circulaire la plus courte entre deux indices
    function circDist(from, to) {
      let d = to - from;
      if (d >  TOTAL / 2) d -= TOTAL;
      if (d < -TOTAL / 2) d += TOTAL;
      return d;
    }

    // ─── État ───────────────────────────────────────────────────────
    let current     = 0;
    let isAnimating = false;

    // ─── Build DOM ──────────────────────────────────────────────────
    const viewer  = document.getElementById('viewer');
    const PAGE_FILES = [
      'export pages/1.png', 'export pages/2.png',
      'export pages/3.png', 'export pages/4.png',
      'export pages/V2/Desktop - 43.png', 'export pages/20 juin/6.png',
      'export pages/20 juin/7.png',
      'export pages/20 juin/8.png',
      'export pages/7.png',
      'export pages/V2/Desktop - 49.png', 'export pages/9.png',
      'export pages/10.png', 'export pages/11.png',
      'export pages/V2/Desktop - 53.png', 'export pages/13.png',
      'export pages/V2/Desktop - 57.png',
      'export pages/V2/Desktop - 55.png', 'export pages/V2/Desktop - 58.png',
      'export pages/V2/Desktop - 59.png', 'export pages/V2/Desktop - 60.png',
      'export pages/V2/Desktop - 56.png'
    ];

    const pageEls = PAGE_FILES.map((file, i) => {
      const div = document.createElement('div');
      div.className = 'page';

      const img = document.createElement('img');
      img.src      = file;
      img.alt      = `Page ${i + 1}`;
      img.draggable = false;

      div.appendChild(img);
      viewer.appendChild(div);
      return div;
    });

    // ─── Position de toutes les pages ───────────────────────────────
    function positionAll(animate) {
      pageEls.forEach((el, i) => {
        const d    = circDist(current, i);
        const absD = Math.abs(d);

        const tx      = d * STEP;
        const scale   = scaleAt(d);
        const opacity = opacityAt(d);
        const rotY    = rotYAt(d);
        const zIndex  = 100 - absD * 8;

        el.style.transition = animate
          ? `transform var(--dur) var(--ease), opacity var(--dur) ease, box-shadow var(--dur) ease`
          : 'none';

        el.style.transform = `translateX(${tx}px) scale(${scale}) rotateY(${rotY}deg)`;
        el.style.opacity   = opacity;
        el.style.zIndex    = zIndex;

        // Ombre sur l'image
        el.querySelector('img').style.boxShadow = shadowAt(d);

        // Pointer events : seule la page active est cliquable
        el.style.pointerEvents = d === 0 ? 'auto' : 'none';
      });
    }

    // ─── Indicateur circulaire ───────────────────────────────────────
    const dotsGroup = document.getElementById('dots-group');
    const dotEls    = Array.from({ length: TOTAL }, (_, i) => {
      const angle = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
      const r  = 34;
      const cx = 44 + r * Math.cos(angle);
      const cy = 44 + r * Math.sin(angle);

      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx);
      c.setAttribute('cy', cy);
      c.setAttribute('r', 2);
      c.classList.add('ronde-dot');
      c.addEventListener('click', () => goTo(i));
      dotsGroup.appendChild(c);
      return c;
    });

    function updateDots() {
      const deg = -(current * 360 / TOTAL);
      dotsGroup.style.transform = `rotate(${deg}deg)`;
      dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    // ─── Navigation ─────────────────────────────────────────────────
    function goTo(index, animate = true) {
      if (isAnimating || index === current) return;
      isAnimating = true;
      const prev  = current;
      current     = ((index % TOTAL) + TOTAL) % TOTAL;

      positionAll(animate);
      updateDots();
      document.getElementById('counter').textContent = `${current + 1} / ${TOTAL}`;

      if (current === 3) startDrawAnim();
      else if (prev === 3) stopDrawAnim();


      if (current === 9) startPage7Yellow();
      else if (prev === 9) stopPage7Yellow();

      setTimeout(() => { isAnimating = false; }, 750);
    }

    function goNext() { goTo((current + 1) % TOTAL); hideHint(); }
    function goPrev() { goTo((current - 1 + TOTAL) % TOTAL); hideHint(); }

    // ─── Init sans animation ─────────────────────────────────────────
    positionAll(false);
    updateDots();

    // ─── Page 4 drawing animation ────────────────────────────────────
    // Drawing bounding box as fractions of 4.png (846×1153) — empty yellow area at bottom
    const DRAW_FRAC = { left: 0.033, top: 0.624, width: 0.934, height: 0.324 };

    const page4div = pageEls[3];
    const page4img = page4div.querySelector('img');

    const drawOverlay = document.createElement('div');
    drawOverlay.id    = 'page4-draw-overlay';
    document.body.appendChild(drawOverlay); // fixed outside the 3D perspective context

    const drawFrameEls = [
      'export pages/Im1.png',
      'export pages/Im2.png',
      'export pages/Im3.png'
    ].map(src => {
      const f = document.createElement('img');
      f.src       = src;
      f.className = 'draw-anim-frame';
      f.draggable = false;
      drawOverlay.appendChild(f);
      return f;
    });


    let drawFrameIdx = -1, drawStartTimer = null, drawCycleTimer = null;

    function positionDrawOverlay() {
      if (!page4img.naturalWidth) return;
      // Overlay is position:fixed on body — getBoundingClientRect gives
      // viewport coordinates that map directly to fixed top/left.
      const r     = page4img.getBoundingClientRect();
      // 4.png = 846×1153, drawings = 790×374 (exact pixel values)
      const scale = Math.min(r.width / 846, r.height / 1153);
      const rW    = 846  * scale;
      const rH    = 1153 * scale;
      const imgX  = r.left + (r.width  - rW) / 2;
      const imgY  = r.top  + (r.height - rH) / 2;
      const w     = 790  * scale;
      const h     = 374  * scale;

      Object.assign(drawOverlay.style, {
        left:   (imgX + (rW - w) / 2) + 'px',
        top:    (imgY + rH - h)       + 'px',
        width:  w + 'px',
        height: h + 'px'
      });
    }

    function advanceDraw() {
      drawFrameEls.forEach(f => f.classList.remove('show'));
      drawFrameIdx = (drawFrameIdx + 1) % drawFrameEls.length;
      drawFrameEls[drawFrameIdx].classList.add('show');
    }

    function startDrawAnim() {
      clearTimeout(drawStartTimer);
      clearInterval(drawCycleTimer);
      drawFrameIdx = 0;
      drawFrameEls.forEach(f => { f.style.transition = 'none'; f.classList.remove('show'); });
      drawFrameEls[0].classList.add('show');
      requestAnimationFrame(() => drawFrameEls.forEach(f => { f.style.transition = ''; }));

      // Wait for page transition (700ms) to finish before measuring position
      drawStartTimer = setTimeout(() => {
        positionDrawOverlay();
        drawOverlay.style.transition = 'none';
        drawOverlay.classList.add('active');
        void drawOverlay.getBoundingClientRect(); // force reflow avant de remettre la transition
        drawOverlay.style.transition = '';
        drawCycleTimer = setInterval(advanceDraw, 2200);
      }, 750);
    }

    function stopDrawAnim() {
      clearTimeout(drawStartTimer);
      clearInterval(drawCycleTimer);
      drawStartTimer = drawCycleTimer = null;
      drawOverlay.classList.remove('active');
      setTimeout(() => {
        drawFrameEls.forEach(f => f.classList.remove('show'));
        drawFrameIdx = -1;
      }, 900);
    }

    window.addEventListener('resize', () => {
      if (current === 3) positionDrawOverlay();
      if (current === 9) positionYellowOverlay();
    });
    page4img.addEventListener('load', () => {
      if (current === 3 && drawOverlay.classList.contains('active')) positionDrawOverlay();
    });

    // ─── Page 7 : montée du jaune ────────────────────────────────────
    const page7img = pageEls[9].querySelector('img');
    const yellowOverlay = document.createElement('div');
    yellowOverlay.id = 'page7-yellow-overlay';
    document.body.appendChild(yellowOverlay);
    let page7Timer = null;

    function positionYellowOverlay() {
      if (!page7img.naturalWidth) return;
      const r  = page7img.getBoundingClientRect();
      const nW = page7img.naturalWidth, nH = page7img.naturalHeight;
      const sc = Math.min(r.width / nW, r.height / nH);
      const rW = nW * sc, rH = nH * sc;
      const imgX = r.left + (r.width  - rW) / 2;
      const imgY = r.top  + (r.height - rH) / 2;
      const h = rH * 0.85; // monte sur 85% de la hauteur de l'image
      Object.assign(yellowOverlay.style, {
        left:   imgX + 'px',
        top:    (imgY + rH - h) + 'px',
        width:  rW + 'px',
        height: h + 'px',
      });
    }

    function startPage7Yellow() {
      page7Timer = setTimeout(() => {
        positionYellowOverlay();
        yellowOverlay.classList.add('active');
      }, 750);
    }

    function stopPage7Yellow() {
      clearTimeout(page7Timer);
      page7Timer = null;
      yellowOverlay.classList.remove('active');
      void yellowOverlay.getBoundingClientRect();
      yellowOverlay.style.transform = 'scaleY(0)';
    }

    // ─── Keyboard ────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goNext(); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goPrev(); }
    });

    // ─── Boutons ─────────────────────────────────────────────────────
    document.getElementById('btn-next').addEventListener('click', goNext);
    document.getElementById('btn-prev').addEventListener('click', goPrev);

    // ─── Swipe tactile ───────────────────────────────────────────────
    let txStart = null, tyStart = null;

    viewer.addEventListener('touchstart', e => {
      txStart = e.touches[0].clientX;
      tyStart = e.touches[0].clientY;
    }, { passive: true });

    viewer.addEventListener('touchend', e => {
      if (txStart === null) return;
      const dx = e.changedTouches[0].clientX - txStart;
      const dy = e.changedTouches[0].clientY - tyStart;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        dx < 0 ? goNext() : goPrev();
      }
      txStart = null;
    }, { passive: true });

    // ─── Glisser souris ──────────────────────────────────────────────
    let mxStart = null, isDragging = false;

    viewer.addEventListener('mousedown', e => { mxStart = e.clientX; isDragging = true; });
    window.addEventListener('mouseup',   e => {
      if (!isDragging) return;
      const dx = e.clientX - mxStart;
      if (Math.abs(dx) > 55) { dx < 0 ? goNext() : goPrev(); }
      isDragging = false;
    });

    // ─── Molette / trackpad ───────────────────────────────────────────
    let wCooldown = false;
    viewer.addEventListener('wheel', e => {
      e.preventDefault();
      if (wCooldown) return;
      const d = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      d > 0 ? goNext() : goPrev();
      wCooldown = true;
      setTimeout(() => { wCooldown = false; }, 750);
    }, { passive: false });

    // ─── Hint ─────────────────────────────────────────────────────────
    const hint = document.getElementById('hint');
    let hintDone = false;
    function hideHint() {
      if (!hintDone) { hintDone = true; hint.classList.add('hidden'); }
    }
    setTimeout(hideHint, 4500);
  </script>
</body>
</html>
